<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>PONDERINGX | Official Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fafafa; 
            color: #4a4a4a; 
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 50px 20px 40px;
            background: linear-gradient(135deg, #ffe0e9, #fff3e0);
            border-bottom: 3px dashed #ffb6c1; 
            border-radius: 0 0 30px 30px; 
        }
        header h1 {
            margin: 0;
            font-size: 3em;
            letter-spacing: 2px;
            color: #ff758c; 
            text-shadow: 2px 2px 0px #fff; 
        }
        header p {
            color: #7a7a7a;
            font-size: 1.1em;
            margin-top: 10px;
            font-weight: 400;
        }
        /* ตกแต่งปุ่ม IG */
        .ig-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); /* สีพื้นหลังแบบ IG */
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3);
            transition: transform 0.2s;
        }
        .ig-button:hover {
            transform: scale(1.05); /* ชี้แล้วปุ่มขยายขึ้นนิดนึง */
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* ตกแต่งรูปปกแผ่นซีดี */
        .album-cover {
            width: 100%;
            max-width: 350px; /* ขนาดกำลังดี ไม่ใหญ่เกินไป */
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2);
            margin-bottom: 40px;
            transition: transform 0.3s;
        }
        .album-cover:hover {
            transform: scale(1.02);
        }
        .song-card {
            background-color: #ffffff; 
            border-radius: 24px; 
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #ffeef2;
        }
        .song-card:hover {
            transform: translateY(-8px); 
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.25);
        }
        .song-title {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ff758c;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .song-title::before {
            content: "🎵";
            margin-right: 12px;
            font-size: 1.2em;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 16px; 
            background-color: #ffeef2; 
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            padding: 30px;
            background-color: #fafafa;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>PONDERINGX</h1>
    <p>✨ Official Music & Videos ✨</p>
    
    <!-- ปุ่มไป IG -->
    <a href="https://www.instagram.com/ponderingx/" target="_blank" class="ig-button">
        📸 Follow on Instagram
    </a>
</header>

<div class="container">
    
    <!-- รูปปกอัลบั้ม (ดึงไฟล์ชื่อ cover.jpg มาแสดง) -->
    <img src="cover.jpg" alt="PONDERINGX Album Cover" class="album-cover">
    
    <!-- เพลงที่ 1 -->
    <div class="song-card">
        <div class="song-title">1. บ่มีสิทธิ์</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 2 -->
    <div class="song-card">
        <div class="song-title">2. ອວຍພອນຍ້ອນຈຳເປັນ อวยพรย้อนจำเป็น</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 3 -->
    <div class="song-card">
        <div class="song-title">3. เต้ยสั่งลา</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</div>

<footer>
    &copy; 2026 PONDERINGX. All Rights Reserved. 🤍
</footer>

</body>
</html>
