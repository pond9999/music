<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>SUNNY | Official Music</title>
    <!-- โหลดฟอนต์ภาษาไทยเพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 60px 20px 40px;
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border-bottom: 2px solid #333;
        }
        header h1 {
            margin: 0;
            font-size: 2.8em;
            letter-spacing: 2px;
            color: #f39c12; /* สีเหลืองทอง สร้างความโดดเด่น */
        }
        header p {
            color: #aaaaaa;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .song-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }
        .song-card:hover {
            transform: translateY(-5px);
        }
        .song-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e0e0e0;
            text-align: left;
            border-left: 4px solid #f39c12;
            padding-left: 15px;
        }
        /* กำหนดให้วิดีโอ YouTube ย่อขยายตามขนาดหน้าจอ (มือถือ/คอม) */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* อัตราส่วน 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            padding: 30px;
            background-color: #0a0a0a;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>SUNNY</h1>
    <p>Official Music & Videos</p>
</header>

<div class="container">
    
    <!-- เพลงที่ 1 -->
    <div class="song-card">
        <div class="song-title">1. บ่มีสิทธิ์</div>
        <div class="video-container">
            <!-- จุดที่ต้องแก้: เปลี่ยน YOUR_VIDEO_ID_1 เป็นรหัสวิดีโอของคุณ -->
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 2 -->
    <div class="song-card">
        <div class="song-title">2. อวยพรย้อนจำเป็น</div>
        <div class="video-container">
            <!-- จุดที่ต้องแก้: เปลี่ยน YOUR_VIDEO_ID_2 เป็นรหัสวิดีโอของคุณ -->
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 3 -->
    <div class="song-card">
        <div class="song-title">3. เต้ยสั่งลา</div>
        <div class="video-container">
            <!-- จุดที่ต้องแก้: เปลี่ยน YOUR_VIDEO_ID_3 เป็นรหัสวิดีโอของคุณ -->
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</div>

<footer>
    &copy; 2026 SUNNY. All Rights Reserved.
</footer>

</body>
</html>
