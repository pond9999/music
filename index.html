<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>PONDERINGX | Official Music</title>
    <!-- โหลดฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fafafa; /* พื้นหลังสีขาวอมเทาอ่อนๆ ให้ดูสบายตา */
            color: #4a4a4a; /* ตัวหนังสือสีเทาเข้ม (ไม่ดำสนิท จะได้ดูละมุน) */
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 50px 20px 40px;
            /* ไล่สีพื้นหลังแบบพาสเทลน่ารักๆ */
            background: linear-gradient(135deg, #ffe0e9, #fff3e0);
            border-bottom: 3px dashed #ffb6c1; /* เส้นประสีชมพูอ่อนเพิ่มความคิวท์ */
            border-radius: 0 0 30px 30px; /* ขอบด้านล่างโค้งมน */
        }
        header h1 {
            margin: 0;
            font-size: 3em;
            letter-spacing: 2px;
            color: #ff758c; /* สีชมพูอมแดงสดใส */
            text-shadow: 2px 2px 0px #fff; /* เงาสีขาวให้ตัวหนังสือเด้งขึ้นมา */
        }
        header p {
            color: #7a7a7a;
            font-size: 1.1em;
            margin-top: 10px;
            font-weight: 400;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .song-card {
            background-color: #ffffff; /* การ์ดสีขาวล้วน */
            border-radius: 24px; /* ขอบการ์ดโค้งมนมากๆ ให้ดูปุ๊กปิ๊ก */
            padding: 25px;
            margin-bottom: 35px;
            /* เงาสีชมพูอ่อนๆ ฟุ้งๆ */
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #ffeef2;
        }
        .song-card:hover {
            transform: translateY(-8px); /* เวลาเอาเมาส์ชี้ให้การ์ดลอยขึ้น */
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.25);
        }
        .song-title {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ff758c;
            text-align: left;
            /* ตกแต่งหน้าชื่อเพลงด้วยจุดกลมๆ น่ารักๆ แทนเส้นทึบ */
            display: flex;
            align-items: center;
        }
        .song-title::before {
            content: "🎵";
            margin-right: 12px;
            font-size: 1.2em;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 16px; /* ขอบวิดีโอโค้งมน */
            background-color: #ffeef2; /* สีพื้นหลังรอก่อนวิดีโอโหลด */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            padding: 30px;
            background-color: #fafafa;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>PONDERINGX</h1>
    <p>✨ Official Music & Videos ✨</p>
</header>

<div class="container">
    
    <!-- เพลงที่ 1 -->
    <div class="song-card">
        <div class="song-title">1. บ่มีสิทธิ์</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 2 -->
    <div class="song-card">
        <div class="song-title">2. ອວຍພອນຍ້ອນຈຳເປັນ อวยพรย้อนจำเป็น</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- เพลงที่ 3 -->
    <div class="song-card">
        <div class="song-title">3. เต้ยสั่งลา</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</div>

<footer>
    &copy; 2026 PONDERINGX. All Rights Reserved. 🤍
</footer>

</body>
</html>
